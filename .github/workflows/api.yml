# Run CI tests
name: TESTS

on:
  # Triggers the workflow on push or pull request events for the dev and main
  # branches or by manually running from the Actions tab.
  push:
    branches: [dev, main, reviewing]
  pull_request:
    branches: [dev, main]
    types: ["opened", "reopened", "synchronize", "ready_for_review"]
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: always.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.13"]
    runs-on: ubuntu-latest
    name: tests-python-${{ matrix.python }}
    # don't run CI on draft PRs
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run tests
        run: pytest  --cov=src/ --cov-report=xml

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: "80 90"

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: (github.event_name == 'pull_request') && (steps.changes.outputs.api == 'true')
        with:
          recreate: true
          path: code-coverage-results.md
